[project]
name = "permscope"
version = "0.1.0"
description = "Infer least-privilege GITHUB_TOKEN permissions for GitHub Actions workflows"
license = {text = "MIT"}
requires-python = ">=3.8"
[project.scripts]
permscope = "permscope.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
